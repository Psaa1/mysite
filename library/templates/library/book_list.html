<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Books</title>
</head>
<body>
  <h1>Books</h1>

  <form method="get">
    <input type="text" name="q" value="{{ q }}" placeholder="Search title or author" />
    <button type="submit">Search</button>
  </form>

  <p><a href="{% url 'home' %}">Home</a></p>

  <table border="1" cellpadding="6">
    <tr>
      <th>Title</th><th>Author</th><th>ISBN</th><th>Year</th><th>Available</th>
    </tr>
    {% for b in books %}
      <tr>
        <td>{{ b.title }}</td>
        <td>{{ b.author }}</td>
        <td>{{ b.isbn }}</td>
        <td>{{ b.published_year }}</td>
        <td>{{ b.is_available }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="5">No books found.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
