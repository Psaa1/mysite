<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Loans</title>
</head>
<body>
  <h1>Loans</h1>
  <p><a href="{% url 'home' %}">Home</a></p>

  <table border="1" cellpadding="6">
    <tr>
      <th>Book</th><th>Borrower</th><th>Loan date</th><th>Due date</th><th>Returned</th>
    </tr>
    {% for l in loans %}
      <tr>
        <td>{{ l.book.title }}</td>
        <td>{{ l.borrower_name }}</td>
        <td>{{ l.loan_date }}</td>
        <td>{{ l.due_date }}</td>
        <td>{% if l.returned_date %}{{ l.returned_date }}{% else %}No{% endif %}</td>
      </tr>
    {% empty %}
      <tr><td colspan="5">No loans found.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
